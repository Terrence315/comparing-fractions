<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparing and Ordering Fractions | Quiz</title><style>body{font-family:system-ui,Arial;background:#f2f5fa;color:#162337;margin:0}main{max-width:760px;margin:28px auto;padding:18px}header,.panel{background:white;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 2px 12px #172b4d15}h1{margin:0 0 8px}button{cursor:pointer;border:1px solid #c9d5e6;border-radius:9px;padding:12px;background:white;text-align:left;font-size:1rem}button:hover{background:#e9f1ff}button:disabled{cursor:default}button.choice{display:block;width:100%;margin:8px 0}.correct{background:#d7f5df!important;border-color:#31975b}.wrong{background:#ffe2e2!important;border-color:#c44}.feedback{font-weight:600;margin-top:12px}#next,#restart{background:#174c9b;color:white;border:0;padding:12px 22px}#next:disabled{opacity:.4}.muted{color:#52627a}#score{font-weight:700} .fraction{white-space:nowrap}</style></head><body><main><header><h1>Comparing and Ordering Fractions</h1><p>Mathematics 700 Fundamentals · Unit 2</p><p class="muted">24 questions · Instant feedback · New random order each attempt</p><div id="score"></div></header><section class="panel" id="quiz"><div id="progress"></div><h2 id="prompt"></h2><div id="choices"></div><p id="feedback" class="feedback" aria-live="polite"></p><button id="next" disabled>Next question</button></section><section class="panel" id="done" hidden><h2>Quiz complete</h2><p id="result"></p><button id="restart">Try again</button></section></main><script>const bank=[{"prompt": "Compare 2/3 ___ 3/4. Choose the correct symbol.", "options": ["cannot compare", "<", "=", ">"], "correct": "<", "explain": "LCD = 12; 2/3 = 8/12 and 3/4 = 9/12. Therefore <."}, {"prompt": "Compare 3/5 ___ 2/3. Choose the correct symbol.", "options": ["cannot compare", ">", "=", "<"], "correct": "<", "explain": "LCD = 15; 3/5 = 9/15 and 2/3 = 10/15. Therefore <."}, {"prompt": "Compare 5/8 ___ 3/4. Choose the correct symbol.", "options": ["cannot compare", "<", ">", "="], "correct": "<", "explain": "LCD = 8; 5/8 = 5/8 and 3/4 = 6/8. Therefore <."}, {"prompt": "Compare 7/12 ___ 2/3. Choose the correct symbol.", "options": ["<", ">", "cannot compare", "="], "correct": "<", "explain": "LCD = 12; 7/12 = 7/12 and 2/3 = 8/12. Therefore <."}, {"prompt": "Compare 4/9 ___ 5/12. Choose the correct symbol.", "options": ["=", "cannot compare", "<", ">"], "correct": ">", "explain": "LCD = 36; 4/9 = 16/36 and 5/12 = 15/36. Therefore >."}, {"prompt": "Compare 7/10 ___ 3/5. Choose the correct symbol.", "options": ["=", ">", "cannot compare", "<"], "correct": ">", "explain": "LCD = 10; 7/10 = 7/10 and 3/5 = 6/10. Therefore >."}, {"prompt": "Compare 5/6 ___ 7/9. Choose the correct symbol.", "options": ["cannot compare", "=", ">", "<"], "correct": ">", "explain": "LCD = 18; 5/6 = 15/18 and 7/9 = 14/18. Therefore >."}, {"prompt": "Compare 3/8 ___ 4/11. Choose the correct symbol.", "options": ["<", ">", "=", "cannot compare"], "correct": ">", "explain": "LCD = 88; 3/8 = 33/88 and 4/11 = 32/88. Therefore >."}, {"prompt": "What is the LCD of fractions with denominators 4 and 6?", "options": ["12", "14", "4", "24"], "correct": "12", "explain": "The least common multiple of 4 and 6 is 12."}, {"prompt": "What is the LCD of fractions with denominators 6 and 8?", "options": ["48", "6", "24", "26"], "correct": "24", "explain": "The least common multiple of 6 and 8 is 24."}, {"prompt": "What is the LCD of fractions with denominators 9 and 12?", "options": ["72", "9", "38", "36"], "correct": "36", "explain": "The least common multiple of 9 and 12 is 36."}, {"prompt": "What is the LCD of fractions with denominators 5 and 10?", "options": ["10", "20", "12", "5"], "correct": "10", "explain": "The least common multiple of 5 and 10 is 10."}, {"prompt": "Which fraction is equivalent to 2/3 with denominator 12?", "options": ["9/12", "8/12", "2/12", "7/12"], "correct": "8/12", "explain": "Multiply numerator and denominator by 4: 2/3 = 8/12."}, {"prompt": "Which fraction is equivalent to 3/4 with denominator 20?", "options": ["14/20", "3/20", "16/20", "15/20"], "correct": "15/20", "explain": "Multiply numerator and denominator by 5: 3/4 = 15/20."}, {"prompt": "Which fraction is equivalent to 5/6 with denominator 18?", "options": ["15/18", "5/18", "14/18", "16/18"], "correct": "15/18", "explain": "Multiply numerator and denominator by 3: 5/6 = 15/18."}, {"prompt": "Which fraction is equivalent to 3/8 with denominator 40?", "options": ["14/40", "16/40", "15/40", "3/40"], "correct": "15/40", "explain": "Multiply numerator and denominator by 5: 3/8 = 15/40."}, {"prompt": "Order from least to greatest: 1/2, 2/3, 3/4.", "options": ["2/3 < 1/2 < 3/4", "3/4 < 2/3 < 1/2", "1/2 < 3/4 < 2/3", "1/2 < 2/3 < 3/4"], "correct": "1/2 < 2/3 < 3/4", "explain": "LCD = 12. 1/2=6/12, 2/3=8/12, 3/4=9/12. Order by the equivalent numerators."}, {"prompt": "Order from least to greatest: 3/8, 1/2, 5/8.", "options": ["1/2 < 3/8 < 5/8", "3/8 < 1/2 < 5/8", "5/8 < 1/2 < 3/8", "3/8 < 5/8 < 1/2"], "correct": "3/8 < 1/2 < 5/8", "explain": "LCD = 8. 3/8=3/8, 1/2=4/8, 5/8=5/8. Order by the equivalent numerators."}, {"prompt": "Order from least to greatest: 2/5, 3/10, 4/5.", "options": ["4/5 < 2/5 < 3/10", "3/10 < 4/5 < 2/5", "3/10 < 2/5 < 4/5", "2/5 < 3/10 < 4/5"], "correct": "3/10 < 2/5 < 4/5", "explain": "LCD = 10. 2/5=4/10, 3/10=3/10, 4/5=8/10. Order by the equivalent numerators."}, {"prompt": "Order from least to greatest: 1/3, 3/4, 1/2.", "options": ["1/3 < 1/2 < 3/4", "1/3 < 3/4 < 1/2", "1/2 < 1/3 < 3/4", "3/4 < 1/2 < 1/3"], "correct": "1/3 < 1/2 < 3/4", "explain": "LCD = 12. 1/3=4/12, 3/4=9/12, 1/2=6/12. Order by the equivalent numerators."}, {"prompt": "Order from least to greatest: 2/3, 3/5, 5/6.", "options": ["3/5 < 5/6 < 2/3", "5/6 < 2/3 < 3/5", "3/5 < 2/3 < 5/6", "2/3 < 3/5 < 5/6"], "correct": "3/5 < 2/3 < 5/6", "explain": "LCD = 30. 2/3=20/30, 3/5=18/30, 5/6=25/30. Order by the equivalent numerators."}, {"prompt": "Order from least to greatest: 3/4, 1/4, 2/5.", "options": ["1/4 < 3/4 < 2/5", "3/4 < 2/5 < 1/4", "2/5 < 1/4 < 3/4", "1/4 < 2/5 < 3/4"], "correct": "1/4 < 2/5 < 3/4", "explain": "LCD = 20. 3/4=15/20, 1/4=5/20, 2/5=8/20. Order by the equivalent numerators."}, {"prompt": "Three friends ate 1/4, 1/2, and 1/3 of equal-size sandwiches. Who ate the largest fraction?", "options": ["1/2", "1/4", "1/3", "all equal"], "correct": "1/2", "explain": "With LCD 12: 1/4=3/12, 1/2=6/12, 1/3=4/12. Largest is 1/2."}, {"prompt": "Which fraction lies farthest to the right on a number line?", "options": ["1/2", "3/4", "5/6", "2/3"], "correct": "5/6", "explain": "Using twelfths or twenty-fourths, 5/6 is greater than the other choices."}];let questions=[],index=0,score=0,answered=false;function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){questions=shuffle(bank).map(q=>({...q,options:shuffle(q.options)}));index=0;score=0;document.getElementById('done').hidden=true;document.getElementById('quiz').hidden=false;render()}function render(){answered=false;let q=questions[index];document.getElementById('score').textContent='Correct: '+score+' / '+index+' answered';document.getElementById('progress').textContent='Question '+(index+1)+' of '+questions.length;document.getElementById('prompt').textContent=q.prompt;document.getElementById('feedback').textContent='';document.getElementById('next').disabled=true;document.getElementById('next').textContent=index===questions.length-1?'Finish quiz':'Next question';let c=document.getElementById('choices');c.replaceChildren();q.options.forEach((opt,i)=>{let b=document.createElement('button');b.className='choice';b.textContent='ABCD'[i]+'. '+opt;b.onclick=()=>choose(opt,b);c.appendChild(b)})}function choose(opt,button){if(answered)return;answered=true;let q=questions[index],right=opt===q.correct;if(right)score++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent.slice(3)===q.correct)b.classList.add('correct')});if(!right)button.classList.add('wrong');document.getElementById('feedback').textContent=(right?'Correct! ':'Not quite. Correct answer: '+q.correct+'. ')+q.explain;document.getElementById('score').textContent='Correct: '+score+' / '+(index+1)+' answered';document.getElementById('next').disabled=false}document.getElementById('next').onclick=()=>{index++;if(index===questions.length){document.getElementById('quiz').hidden=true;document.getElementById('done').hidden=false;document.getElementById('result').textContent='Your score: '+score+' / '+questions.length+' ('+Math.round(score/questions.length*100)+'%).'}else render()};document.getElementById('restart').onclick=start;start();</script></body></html>
